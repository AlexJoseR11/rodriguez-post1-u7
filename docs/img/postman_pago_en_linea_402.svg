<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <defs>
    <style>
      .bg { fill: #1e1e1e; rx: 8px; }
      .header { fill: #2d2d2d; }
      .title { fill: #ffffff; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 600; }
      .method-post { fill: #e58e26; font-family: monospace; font-weight: bold; font-size: 13px; }
      .url { fill: #dcdde1; font-family: monospace; font-size: 13px; }
      .status-badge-payment { fill: #d63031; rx: 4px; }
      .status-text { fill: #ffffff; font-family: monospace; font-size: 12px; font-weight: bold; }
      .time-text { fill: #a4b0be; font-family: 'Segoe UI', sans-serif; font-size: 12px; }
      .pane-bg { fill: #252526; rx: 6px; }
      .json-key { fill: #9cdcfe; font-family: 'Consolas', monospace; font-size: 12.5px; }
      .json-val-str { fill: #ce9178; font-family: 'Consolas', monospace; font-size: 12.5px; }
      .json-val-num { fill: #b5cea8; font-family: 'Consolas', monospace; font-size: 12.5px; }
      .json-punct { fill: #d4d4d4; font-family: 'Consolas', monospace; font-size: 12.5px; }
    </style>
  </defs>

  <rect width="800" height="380" class="bg" />
  
  <!-- Window Header -->
  <path d="M 0 0 L 800 0 L 800 40 L 0 40 Z" class="header" />
  <circle cx="20" cy="20" r="6" fill="#ff5f56" />
  <circle cx="38" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="56" cy="20" r="6" fill="#27c93f" />
  <text x="80" y="25" class="title">Postman — POST /api/multas/2/pagar-en-linea (Rechazo Pasarela)</text>

  <!-- URL Bar -->
  <rect x="20" y="55" width="760" height="38" rx="5" fill="#2d2d2d" stroke="#3e3e42" stroke-width="1" />
  <text x="35" y="79" class="method-post">POST</text>
  <text x="85" y="79" class="url">http://localhost:8080/api/multas/2/pagar-en-linea</text>
  
  <!-- Status & Time Bar -->
  <rect x="550" y="62" width="145" height="24" class="status-badge-payment" />
  <text x="560" y="78" class="status-text">402 PAYMENT REQ.</text>
  <text x="705" y="78" class="time-text">31 ms</text>

  <!-- Response Section -->
  <rect x="20" y="105" width="760" height="255" class="pane-bg" stroke="#3e3e42" stroke-width="1" />
  <text x="35" y="130" fill="#a4b0be" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="600">Response Body (JSON):</text>
  
  <text x="40" y="160" class="json-punct">{</text>
  <text x="60" y="190" class="json-key">"timestamp"</text><text x="145" y="190" class="json-punct">: </text><text x="155" y="190" class="json-val-str">"2026-10-03T08:14:17.778293"</text><text x="360" y="190" class="json-punct">,</text>
  <text x="60" y="220" class="json-key">"status"</text><text x="110" y="220" class="json-punct">: </text><text x="120" y="220" class="json-val-num">402</text><text x="145" y="220" class="json-punct">,</text>
  <text x="60" y="250" class="json-key">"error"</text><text x="105" y="250" class="json-punct">: </text><text x="115" y="250" class="json-val-str">"Payment Required"</text><text x="260" y="250" class="json-punct">,</text>
  <text x="60" y="280" class="json-key">"message"</text><text x="125" y="280" class="json-punct">: </text><text x="135" y="280" class="json-val-str">"Pago rechazado por pasarela [PAGOSUDES]: Fallo de comunicacion con PagosUDES..."</text><text x="720" y="280" class="json-punct">,</text>
  <text x="60" y="310" class="json-key">"path"</text><text x="100" y="310" class="json-punct">: </text><text x="110" y="310" class="json-val-str">"/api/multas/2/pagar-en-linea"</text>
  <text x="40" y="340" class="json-punct">}</text>
</svg>
